<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@timi2506</title>
    <style>
        @import url('https://abs.twimg.com/responsive-web/client-web/Chirp-Regular.80fda27a.woff2');

        /* macOS & Twitter-like Styling */
        body {
            font-family: 'TwitterChirp', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 600px;
            background: #000;
            min-height: 100vh;
            border-left: 1px solid #2F3336;
            border-right: 1px solid #2F3336;
        }

        /* Profile Header */
        .header {
            background: url('https://pbs.twimg.com/profile_banners/1671731225424195584/1704821295/1500x500') no-repeat center;
            background-size: cover;
            height: 200px;
            position: relative;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid black;
            position: absolute;
            bottom: -50px;
            left: 20px;
        }

        /* Profile Info */
        .profile-info {
            padding: 60px 20px 10px;
        }

        .profile-info h1 {
            font-size: 22px;
            margin: 0;
        }

        .username {
            color: #71767b;
            font-size: 15px;
        }

        .bio {
            font-size: 14px;
            color: #d9d9d9;
            margin-bottom: 10px;
        }

        .bio a {
            color: #1DA1F2;
            text-decoration: none;
            font-weight: bold;
        }

        .bio a:hover {
            text-decoration: underline;
        }

        /* Social Links */
        .socials {
            font-size: 14px;
            color: #d9d9d9;
            margin-top: 5px;
        }

        .socials a {
            color: #1DA1F2;
            text-decoration: none;
            margin-right: 10px;
        }

        .socials a:hover {
            text-decoration: underline;
        }

        /* Repository Feed (Tweets) */
        .repo-feed {
            padding: 10px;
        }

        .repo {
            padding: 15px;
            border-bottom: 1px solid #2F3336;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .repo:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .repo-title {
            font-weight: bold;
            font-size: 16px;
        }

        .repo-description {
            font-size: 14px;
            color: #d9d9d9;
            margin-top: 5px;
        }

        .repo-date {
            font-size: 12px;
            color: #71767b;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <div class="header">
            <img src="https://pbs.twimg.com/profile_images/1848767530292183041/XEQM3vo2_400x400.jpg" alt="Profile Picture" class="profile-pic">
        </div>

        <!-- Profile Info -->
        <div class="profile-info">
            <h1> Tim</h1>
            <p class="username">@timi2506</p>
            <p class="bio">14 • Writer at <a href="https://x.com/MacLine23" target="_blank">@MacLine23</a> • Interested in Tech, UI Design, and SwiftUI</p>
            
            <!-- Social Links -->
            <p class="socials">
                <a href="https://twitter.com/timi2506" target="_blank">Twitter</a> •
                <a href="https://github.com/timi2506" target="_blank">GitHub</a>
            </p>
        </div>

        <!-- Repository Feed -->
        <div class="repo-feed" id="repo-feed">
            <p style="text-align:center;">Loading repositories...</p>
        </div>
    </div>

    <script>
        async function fetchGitHubRepos() {
            const response = await fetch("https://api.github.com/users/timi2506/repos?sort=updated");
            const repos = await response.json();
            const repoFeed = document.getElementById("repo-feed");

            repoFeed.innerHTML = repos.map(repo => 
                `<div class="repo" onclick="window.open('${repo.html_url}', '_blank')">
                    <div class="repo-title">${repo.name}</div>
                    <div class="repo-description">${repo.description || "No description available"}</div>
                    <div class="repo-date">Updated on ${new Date(repo.updated_at).toDateString()}</div>
                </div>`
            ).join("");
        }

        fetchGitHubRepos();
    </script>

</body>
</html>
